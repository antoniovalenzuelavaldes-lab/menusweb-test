<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel de la carta · Restaurante Test</title>
<style>
:root{--azul:#0f2a47;--azul2:#1c4670;--arena:#f3ead9;--hueso:#fbf7ef;--tomate:#c8412b;--oliva:#5f6f2f;--tinta:#1d2733;--linea:#d9ccb2}
*{box-sizing:border-box}
body{margin:0;background:var(--hueso);color:var(--tinta);font:18px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:20px 18px 90px}
h1{font:400 28px Georgia,serif;color:var(--azul);margin:0}
h2{font:400 22px Georgia,serif;margin:22px 0 10px}
.marca{text-align:center;letter-spacing:.3em;font:400 30px Georgia,serif;color:var(--azul);padding:34px 0 6px}
.cab{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.atras{border:0;background:var(--arena);width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer;flex:none}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:18px;font:600 19px system-ui,sans-serif;cursor:pointer;margin:10px 0;background:var(--azul);color:#fff;text-align:center;text-decoration:none}
.btn.rojo{background:var(--tomate)}.btn.claro{background:var(--arena);color:var(--tinta)}.btn.peligro{background:#fff;color:#a02020;border:2px solid #e3b5b5}
.btn:disabled{opacity:.45}
.btn small{display:block;font:400 14px system-ui;opacity:.85;margin-top:2px}
input[type=text],input[type=password],input[type=number],textarea,input:not([type]){width:100%;font:22px system-ui,sans-serif;padding:16px;border:2px solid var(--linea);border-radius:14px;background:#fff;color:var(--tinta)}
textarea{font-size:18px;min-height:90px}
label{display:block;font-weight:600;margin:16px 0 6px}
.pregunta{font:400 26px/1.25 Georgia,serif;margin:10px 0 18px}
.progreso{height:8px;background:var(--arena);border-radius:6px;margin:0 0 20px;overflow:hidden}.progreso i{display:block;height:100%;background:var(--tomate)}
.cat.sel{border-color:var(--tomate);background:#fff4ef}
.ver{display:inline-block;margin:-2px 0 8px 6px;font-size:15px;color:var(--azul2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--linea);background:#fff;border-radius:24px;padding:10px 16px;font:17px system-ui;cursor:pointer;color:var(--tinta)}
.chip.on{background:var(--oliva);border-color:var(--oliva);color:#fff}
.cat{display:block;width:100%;text-align:left;border:2px solid var(--linea);background:#fff;border-radius:14px;padding:16px;margin:8px 0;font:20px system-ui;cursor:pointer;color:var(--tinta)}
.cat small{opacity:.65;font-size:15px}
.aviso{background:#fff3cd;border-radius:14px;padding:14px 16px;margin:14px 0}
.ok{background:#e4efd4;border-radius:14px;padding:14px 16px;margin:14px 0}
.error{color:#a02020;font-weight:600;min-height:24px;margin:8px 0}
.fila{display:flex;gap:12px;align-items:center;width:100%;border:0;background:#fff;border-bottom:1px solid var(--linea);padding:10px 4px;text-align:left;font:18px system-ui;cursor:pointer;color:var(--tinta)}
.fila .t{flex:1;min-width:0}.fila b{font-weight:600}.fila .s{font-size:14px;color:#a0522d}
.fila img,.fila .nf{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--arena)}
.fila .nf{display:flex;align-items:center;justify-content:center;font-size:22px}
.fila.oculto{opacity:.5}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.fotos img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;cursor:pointer;border:3px solid transparent}
.fotos img.on{border-color:var(--tomate)}
.vista{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block;margin:6px 0}
details{margin:18px 0;background:var(--arena);border-radius:14px;padding:12px 16px}summary{font-weight:600;cursor:pointer}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--azul);color:#fff;padding:12px 22px;border-radius:30px;font:600 16px system-ui;display:none;z-index:50;max-width:92%;text-align:center}
#toast.mal{background:#a02020}
#vel{position:fixed;inset:0;background:#fffc;display:none;align-items:center;justify-content:center;font:600 22px system-ui;z-index:40}
.grande{font-size:64px;text-align:center;margin:20px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="vel">Subiendo foto…</div>
<input type="file" id="f-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="f-gal" accept="image/*" hidden>
<script>
const CARTA = {"restaurante": {"nombre": "Restaurante Test", "subtitulo": "", "ciudad": "", "cocina": ""}, "estilo": {"colores": {}, "franja": ["#2f8f4e", "#ffffff", "#c8412b"]}, "textos": {"lema": {"es": "Il mare davanti, l'Italia nel piatto.", "en": "The sea in front of us, Italy on the plate.", "de": "Das Meer vor der Tür, Italien auf dem Teller."}, "frase": {"es": "Productos italianos 100 % orgánicos y frescos", "en": "100% organic and fresh Italian products", "de": "100 % biologische und frische italienische Produkte"}, "singluten": {"es": "Opción sin gluten +2 € en pasta y pizza", "en": "Gluten-free option +2 € on pasta and pizza", "de": "Glutenfreie Option +2 € bei Pasta und Pizza"}, "destacados": {"es": "Le Specialità della Casa", "en": "Le Specialità della Casa", "de": "Le Specialità della Casa"}}, "variante": "lista", "url": "https://antoniovalenzuelavaldes-lab.github.io/menusweb-test/", "goatcounter": "", "categorias": [{"id": "antipasti", "nombre": "Antipasti", "sub": {"es": "Entrantes", "en": "Starters", "de": "Vorspeisen"}, "platos": [{"nombre": "Caprese", "precio": 10.0, "alergenos": ["milk"], "vegetariano": true, "slug": "caprese", "foto": "caprese.jpg"}, {"nombre": "Tagliere di Salumi con Gnocco Fritto", "precio": 14.0, "alergenos": [], "slug": "tagliere-di-salumi-con-gnocco-fritto", "foto": "tagliere-di-salumi-con-gnocco-fritto.jpg"}, {"nombre": "Bruschette", "precio": null, "slug": "bruschette", "foto": null}, {"nombre": "Parmigiana di Melanzane", "precio": null, "slug": "parmigiana-di-melanzane", "foto": null}]}, {"id": "primi", "nombre": "Primi", "sub": {"es": "Pasta", "en": "Pasta", "de": "Pasta"}, "nota": "singluten", "platos": [{"nombre": "Lasagna di Carne", "precio": 14.0, "slug": "lasagna-di-carne", "foto": "lasagna-di-carne.jpg"}, {"nombre": "Lasagna Mista", "precio": 15.0, "slug": "lasagna-mista", "foto": null}, {"nombre": "Pasta al Pomodoro e Basilico", "precio": 11.5, "vegetariano": true, "slug": "pasta-al-pomodoro-e-basilico", "foto": null}, {"nombre": "Pasta Aglio, Olio e Peperoncino Calabrese", "precio": 11.5, "vegetariano": true, "picante": true, "slug": "pasta-aglio-olio-e-peperoncino-calabrese", "foto": null}, {"nombre": "Pasta alla Carbonara", "precio": 14.0, "slug": "pasta-alla-carbonara", "foto": "pasta-alla-carbonara.jpg"}, {"nombre": "Pasta alla Amatriciana", "precio": 14.0, "slug": "pasta-alla-amatriciana", "foto": "pasta-alla-amatriciana.jpg"}, {"nombre": "Pasta con Gamberi", "precio": null, "slug": "pasta-con-gamberi", "foto": "pasta-con-gamberi.jpg"}]}, {"id": "secondi", "nombre": "Secondi", "sub": {"es": "Segundos", "en": "Main courses", "de": "Hauptgerichte"}, "platos": [{"nombre": "Cotoletta con Patate Fritte", "precio": 14.0, "slug": "cotoletta-con-patate-fritte", "foto": "cotoletta-con-patate-fritte.jpg"}]}, {"id": "pizza", "nombre": "Pizza", "sub": {"es": "Pizzas", "en": "Pizzas", "de": "Pizzen"}, "nota": "singluten", "platos": [{"nombre": "Quattro Formaggi", "precio": 12.0, "slug": "quattro-formaggi", "foto": "quattro-formaggi.jpg"}, {"nombre": "Quattro Stagioni", "precio": 13.0, "slug": "quattro-stagioni", "foto": "quattro-stagioni.jpg"}, {"nombre": "Tonno e Cipolla", "precio": 12.0, "slug": "tonno-e-cipolla", "foto": null}, {"nombre": "Carbonara", "precio": 13.0, "slug": "carbonara", "foto": null}, {"nombre": "Barbacoa", "precio": 13.0, "slug": "barbacoa", "foto": null}, {"nombre": "Salame", "precio": 12.0, "slug": "salame", "foto": "salame.jpg"}, {"nombre": "Il Faro", "precio": 15.0, "slug": "il-faro", "foto": null}, {"nombre": "Mostacchio", "precio": 16.0, "nuevo": true, "slug": "mostacchio", "foto": null}, {"nombre": "Salmone", "precio": 18.0, "nuevo": true, "slug": "salmone", "foto": "salmone.jpg"}, {"nombre": "Frutti di Mare", "precio": 18.0, "desc": {"es": "Mix de mariscos, salsa de tomate italiana y mozzarella", "en": "Seafood mix, Italian tomato sauce and mozzarella", "de": "Meeresfrüchte-Mix, italienische Tomatensauce und Mozzarella"}, "slug": "frutti-di-mare", "foto": "frutti-di-mare.jpg"}, {"nombre": "Americana (Wurstel e Patatine)", "precio": 19.0, "slug": "americana-wurstel-e-patatine", "foto": null}, {"nombre": "Parmigiana", "precio": 16.0, "slug": "parmigiana", "foto": null}]}, {"id": "dolci", "nombre": "Dolci", "sub": {"es": "Postres", "en": "Desserts", "de": "Desserts"}, "platos": [{"nombre": "Tiramisù", "precio": null, "slug": "tiramisu", "foto": "tiramisu.jpg"}, {"nombre": "Cheesecake", "precio": null, "slug": "cheesecake", "foto": null}]}], "destacados": ["Il Faro", "Tagliere di Salumi con Gnocco Fritto", "Lasagna di Carne", "Pasta alla Carbonara"], "indexar": false, "api": "https://menusweb-api.antonio-valenzuela-valdes.workers.dev", "sitio": "https://tucartaweb.online/"};
const FOTOS="../fotos/", API="https://menusweb-api.antonio-valenzuela-valdes.workers.dev", RID="test", LIBRES=["dolce-crema-menta-2.jpg", "dolce-crema-menta.jpg", "gamberoni-alla-griglia.jpg", "insalata-rucola-grana.jpg", "pasta-alla-carbonara-2.jpg", "pasta-alla-norma.jpg", "pasta-corta-pomodorini.jpg", "pizza-burrata-rucola.jpg", "pizza-margherita.jpg", "pizza-prosciutto-funghi.jpg", "pizza-prosciutto-peperoni-2.jpg", "pizza-prosciutto-peperoni.jpg", "pizza-verdure.jpg", "salame-2.jpg", "spaghetti-bolognese-2.jpg", "spaghetti-bolognese.jpg", "tagliatelle-ragu-pesto.jpg", "tagliolini-gambero.jpg"], DISENOS=[["lista", "Versión 1 · Clásica", "Carta elegante solo con texto: nombre, descripción y precio. La foto se ve al tocar un plato."], ["fotos", "Versión 2 · Lista con fotos", "Cada plato muestra su foto en pequeño junto al precio."], ["rejilla", "Versión 3 · Rejilla", "Platos en tarjetas de dos columnas con la foto grande, como una app."], ["pestanas", "Versión 4 · Por pestañas", "Una categoría cada vez: el cliente toca Pizza, Pasta, Dolci... y ve solo esa."], ["revista", "Versión 5 · Revista", "Una foto grande a todo el ancho por cada plato. La más vistosa."]], CARPETAS=["v1", "v2", "v3", "v4", "v5"], VINI="lista";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fu=f=>/^(https?:|data:)/.test(f)?f:FOTOS+f;
const eur=n=>n.toFixed(2).replace(".",",")+" €";
const ALER={milk:"Lácteos",gluten:"Gluten",egg:"Huevo",fish:"Pescado",shellfish:"Crustáceos",molluscs:"Moluscos",nuts:"Frutos secos",peanuts:"Cacahuetes",soy:"Soja",celery:"Apio",mustard:"Mostaza",sesame:"Sésamo",sulphites:"Sulfitos",lupin:"Altramuces"};
let S={token:null,carta:null};
const nombreRest=()=>(S.carta&&S.carta.ajustes&&S.carta.ajustes.nombre)||CARTA.restaurante.nombre;
let W=null;           // estado del asistente actual
try{S.token=sessionStorage.getItem("mw_token")}catch(e){}

/* ---------- servidor ---------- */
async function api(metodo,ruta,cuerpo,cabeceras){
  if(!API)throw new Error("Esta página aún no está conectada a un servidor.");
  const h=Object.assign({},cabeceras||{});if(S.token)h.Authorization="Bearer "+S.token;
  const r=await fetch(API+ruta,{method:metodo,headers:h,body:cuerpo});
  let d=null;try{d=await r.json()}catch(e){}
  if(r.status===401&&ruta.indexOf("/login/")<0){S.token=null;try{sessionStorage.removeItem("mw_token")}catch(e){}login("Tu sesión ha caducado. Vuelve a entrar.");throw new Error("sesion")}
  if(!r.ok)throw new Error((d&&d.error)||"Error "+r.status);
  return d;
}
let cola=Promise.resolve();
function toast(t,ms,mal,click){const e=$("toast");e.textContent=t;e.className=mal?"mal":"";e.style.display="block";e.onclick=click||null;clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>e.style.display="none",ms)}
function guardar(){
  toast("Guardando…");
  cola=cola.then(()=>api("PUT","/admin/carta/"+RID,JSON.stringify({categorias:S.carta.categorias,destacados:S.carta.destacados||[],ajustes:S.carta.ajustes}),{"Content-Type":"application/json"}))
    .then(()=>toast("Guardado ✓ Ya lo ven tus clientes",2200))
    .catch(e=>{if(e.message!=="sesion")toast("No se pudo guardar. Toca aquí para reintentar",0,true,guardar)});
  return cola;
}
async function subirFoto(file){
  $("vel").style.display="flex";
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
    const k=Math.min(1,900/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));
    const d=await api("PUT","/admin/foto/"+RID,blob,{"Content-Type":"image/jpeg"});
    return d.url;
  }finally{$("vel").style.display="none"}
}

/* ---------- datos ---------- */
const platos=()=>{const o=[];S.carta.categorias.forEach((c,i)=>c.platos.forEach((p,j)=>o.push({c,i,p,j})));return o};
const usadas=()=>new Set(platos().map(x=>x.p.foto).filter(Boolean));
const libres=()=>{const u=usadas();return LIBRES.filter(f=>!u.has(f))};
function pendientes(){const t=[];platos().forEach(({p})=>{if(p.oculto)return;if(p.precio==null)t.push({p,t:"precio"});if(!p.foto)t.push({p,t:"foto"})});return t}
function precioDe(txt){const n=Number(String(txt).replace(",",".").replace(/[^\d.]/g,""));return isFinite(n)&&n>0&&n<1000?Math.round(n*100)/100:null}
const slug=t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const vista=h=>{$("app").innerHTML=h;scrollTo(0,0)};
const cab=(t,a)=>`<div class="cab">${a?`<button class="atras" data-a="${a}" aria-label="Atrás">←</button>`:""}<h1>${t}</h1></div>`;

/* ---------- pantallas ---------- */
function login(msg){
  vista(`<div class="marca">${esc(nombreRest())}</div><p style="text-align:center;opacity:.7;margin-top:0">Panel de la carta</p>
  ${API?"":`<div class="aviso">Esta página aún no está conectada al servidor. Se activará cuando la carta se publique.</div>`}
  <label for="clave">Tu clave</label><input type="password" id="clave" autocomplete="current-password" placeholder="Escribe tu clave">
  <div class="error" id="err">${esc(msg||"")}</div><button class="btn rojo" data-a="entrar">Entrar</button>`);
  $("clave").addEventListener("keydown",e=>{if(e.key==="Enter")ACC.entrar()});
}
async function cargar(){
  try{S.carta=await api("GET","/carta/"+RID)}
  catch(e){if(e.message==="sesion")return false;S.carta={categorias:JSON.parse(JSON.stringify(CARTA.categorias)),destacados:CARTA.destacados||[]}}
  S.carta.ajustes=Object.assign({nombre:CARTA.restaurante.nombre,subtitulo:CARTA.restaurante.subtitulo||"",variante:VINI},S.carta.ajustes||{});
  return true;
}
function home(){
  const n=pendientes().length,total=platos().length;
  vista(`<div class="marca" style="padding-top:12px">${esc(nombreRest())}</div><p style="text-align:center;opacity:.7;margin-top:0">¿Qué quieres hacer hoy?</p>
  ${n?`<button class="btn rojo" data-a="pend">⚠️ Completar lo que falta<small>${n} cosas sin precio o sin foto</small></button>`:`<div class="ok">✓ Todos tus platos tienen precio y foto.</div>`}
  <button class="btn" data-a="nuevo">➕ Añadir un plato nuevo<small>Te preguntamos paso a paso</small></button>
  <button class="btn claro" data-a="lista">✏️ Ver y corregir mis platos<small>${total} platos en la carta</small></button>
  <button class="btn claro" data-a="ajustes">⚙️ Datos del restaurante y diseño<small>Nombre y aspecto de la carta</small></button>
  <a class="btn claro" href="../" target="_blank" rel="noopener">👁 Ver mi carta como la ven los clientes</a>
  <button class="btn claro" data-a="salir" style="margin-top:30px;background:#fff;border:2px solid var(--linea)">Salir</button>`);
}

/* completar lo que falta */
function pend(k){
  const t=pendientes();W={tipo:"pend",k:k||0,total:(k?W.total:t.length)};
  paso_pend();
}
function paso_pend(){
  const t=pendientes();
  if(!t.length||W.k>=W.total+1){return fin("¡Listo!","Ya no falta nada por completar.")}
  const x=t[0]; W.actual=x;
  const hecho=Math.min(W.total-t.length,W.total);
  const barra=`<div class="progreso"><i style="width:${Math.round(100*hecho/W.total)}%"></i></div>`;
  if(x.t==="precio"){
    vista(cab("Completar","home")+barra+`<div class="pregunta">¿Cuánto cuesta <b>${esc(x.p.nombre)}</b>?</div>
    <input type="text" inputmode="decimal" id="precio" placeholder="Por ejemplo 12,50" autofocus><div class="error" id="err"></div>
    <button class="btn rojo" data-a="pend-precio">Guardar y seguir</button><button class="btn claro" data-a="pend-saltar">Saltar este</button>`);
    $("precio").addEventListener("keydown",e=>{if(e.key==="Enter")ACC["pend-precio"]()});
  }else{
    vista(cab("Completar","home")+barra+`<div class="pregunta">Foto de <b>${esc(x.p.nombre)}</b></div>${selectorFoto()}
    <button class="btn claro" data-a="pend-saltar">Saltar este</button>`);
    W.cb=url=>{x.p.foto=url;guardar();paso_pend()};
  }
}
function saltar(){ // marca como saltado temporalmente
  const x=W.actual;W.saltados=(W.saltados||[]);W.saltados.push(x);
  if(x.t==="precio")x.p._saltaP=true;else x.p._saltaF=true;
  paso_pend_sig();
}
function paso_pend_sig(){
  const t=pendientes().filter(x=>!(x.t==="precio"?x.p._saltaP:x.p._saltaF));
  if(!t.length){platos().forEach(({p})=>{delete p._saltaP;delete p._saltaF});return fin("Hasta aquí","Lo que has saltado sigue pendiente. Puedes completarlo cuando quieras.")}
  const x=t[0];W.actual=x;
  const hecho=W.total-pendientes().length;
  const barra=`<div class="progreso"><i style="width:${Math.round(100*hecho/W.total)}%"></i></div>`;
  if(x.t==="precio"){
    vista(cab("Completar","home")+barra+`<div class="pregunta">¿Cuánto cuesta <b>${esc(x.p.nombre)}</b>?</div>
    <input type="text" inputmode="decimal" id="precio" placeholder="Por ejemplo 12,50"><div class="error" id="err"></div>
    <button class="btn rojo" data-a="pend-precio">Guardar y seguir</button><button class="btn claro" data-a="pend-saltar">Saltar este</button>`);
    $("precio").addEventListener("keydown",e=>{if(e.key==="Enter")ACC["pend-precio"]()});
  }else{
    vista(cab("Completar","home")+barra+`<div class="pregunta">Foto de <b>${esc(x.p.nombre)}</b></div>${selectorFoto()}
    <button class="btn claro" data-a="pend-saltar">Saltar este</button>`);
    W.cb=url=>{x.p.foto=url;guardar();paso_pend_sig()};
  }
}
function fin(titulo,txt){
  platos().forEach(({p})=>{delete p._saltaP;delete p._saltaF});
  vista(`<div class="grande">✅</div><h1 style="text-align:center;margin-top:10px">${titulo}</h1><p style="text-align:center">${txt}</p>
  <button class="btn rojo" data-a="home">Volver al inicio</button>`);
}

/* selector de foto (reutilizable) */
function selectorFoto(actual){
  const l=libres();
  return `${actual?`<img class="vista" src="${esc(fu(actual))}" alt="">`:""}
  <button class="btn" data-a="cam">📷 Hacer una foto</button>
  <button class="btn claro" data-a="gal">🖼 Elegir de la galería</button>
  ${l.length?`<h2>…o una de las fotos que ya tenemos</h2><div class="fotos">${l.map(f=>`<img src="${esc(fu(f))}" data-a="libre" data-f="${esc(f)}" alt="">`).join("")}</div>`:""}`;
}

/* datos del restaurante y diseño */
function ajustes(){
  const a=S.carta.ajustes;W={tipo:"ajustes",variante:a.variante};
  vista(cab("Datos y diseño","home")+`<label for="nombre">Nombre del restaurante</label><input type="text" id="nombre" value="${esc(a.nombre)}">
  <label for="sub">Subtítulo (opcional)</label><input type="text" id="sub" value="${esc(a.subtitulo)}" placeholder="Por ejemplo: Ristorante Pizzeria">
  <h2>¿Qué diseño quieres para tu carta?</h2>
  ${DISENOS.map(([m,t,d],i)=>`<button class="cat ${m===a.variante?"sel":""}" data-a="diseno" data-m="${m}"><b>${esc(t)}</b><br><small>${esc(d)}</small></button><a class="ver" href="../${CARPETAS[i]}/" target="_blank" rel="noopener">Ver cómo queda ↗</a>`).join("")}
  <div class="error" id="err"></div><button class="btn rojo" data-a="aj-guardar">✓ Guardar</button>`);
}

/* añadir plato nuevo */
function nuevo(){W={tipo:"nuevo",paso:1,p:{nombre:"",precio:null,foto:null,alergenos:[]},cat:null};paso_nuevo()}
function paso_nuevo(){
  const p=W.p,n=W.paso,barra=`<div class="progreso"><i style="width:${n*20}%"></i></div>`;
  if(n===1){
    vista(cab("Plato nuevo","home")+barra+`<div class="pregunta">¿Cómo se llama el plato?</div>
    <input type="text" id="nombre" value="${esc(p.nombre)}" placeholder="Por ejemplo: Pizza Margherita"><div class="error" id="err"></div>
    <button class="btn rojo" data-a="n-sig">Siguiente</button>`);
    $("nombre").focus();$("nombre").addEventListener("keydown",e=>{if(e.key==="Enter")ACC["n-sig"]()});
  }else if(n===2){
    vista(cab("Plato nuevo","n-atras")+barra+`<div class="pregunta">¿En qué parte de la carta va <b>${esc(p.nombre)}</b>?</div>
    ${S.carta.categorias.map((c,i)=>`<button class="cat" data-a="n-cat" data-i="${i}">${esc(c.nombre)} <small>${esc((c.sub&&c.sub.es)||"")}</small></button>`).join("")}
    <button class="cat" data-a="n-cat-nueva" style="border-style:dashed">➕ Otra sección nueva (bebidas, vinos…)</button>`);
  }else if(n===3){
    vista(cab("Plato nuevo","n-atras")+barra+`<div class="pregunta">¿Cuánto cuesta?</div>
    <input type="text" inputmode="decimal" id="precio" value="${p.precio==null?"":String(p.precio).replace(".",",")}" placeholder="Por ejemplo 12,50"><div class="error" id="err"></div>
    <button class="btn rojo" data-a="n-sig">Siguiente</button><button class="btn claro" data-a="n-sinprecio">Aún no lo sé</button>`);
    $("precio").focus();$("precio").addEventListener("keydown",e=>{if(e.key==="Enter")ACC["n-sig"]()});
  }else if(n===4){
    vista(cab("Plato nuevo","n-atras")+barra+`<div class="pregunta">¿Tiene foto?</div>${selectorFoto(p.foto)}
    <button class="btn claro" data-a="n-sinfoto">${p.foto?"Siguiente":"Sin foto por ahora"}</button>`);
    W.cb=url=>{p.foto=url;paso_nuevo()};
  }else{
    vista(cab("Revisa y añade","n-atras")+barra+`<div class="ok" style="background:#fff;border:2px solid var(--linea)">
      ${p.foto?`<img class="vista" src="${esc(fu(p.foto))}" alt="">`:""}
      <b style="font-size:22px">${esc(p.nombre)}</b><br>${esc(S.carta.categorias[W.cat].nombre)} · ${p.precio==null?"<span style='color:#a0522d'>sin precio</span>":eur(p.precio)}</div>
    ${extras(p)}
    <button class="btn rojo" data-a="n-fin">✓ Añadir a la carta</button>`);
  }
}
function extras(p){
  return `<details><summary>Más opciones (no hace falta)</summary>
  <label for="desc">Descripción corta</label><textarea id="desc" placeholder="Ingredientes en una línea">${esc((p.desc&&p.desc.es)||"")}</textarea>
  <div class="chips" style="margin-top:14px"><button class="chip ${p.vegetariano?"on":""}" data-a="tog" data-k="vegetariano">🌱 Vegetariano</button><button class="chip ${p.picante?"on":""}" data-a="tog" data-k="picante">🌶 Picante</button></div>
  <label>Alérgenos</label><div class="chips">${Object.keys(ALER).map(k=>`<button class="chip ${(p.alergenos||[]).includes(k)?"on":""}" data-a="alerg" data-k="${k}">${ALER[k]}</button>`).join("")}</div></details>`;
}
function leerDesc(p){const d=$("desc");if(d){const v=d.value.trim();if(v)p.desc={es:v};else delete p.desc}}

/* lista y edición */
function lista(){
  vista(cab("Mis platos","home")+S.carta.categorias.map((c,i)=>c.platos.length?`<h2>${esc(c.nombre)}</h2>`+c.platos.map((p,j)=>`<button class="fila ${p.oculto?"oculto":""}" data-a="editar" data-i="${i}" data-j="${j}">
    ${p.foto?`<img src="${esc(fu(p.foto))}" loading="lazy" alt="">`:`<div class="nf">📷</div>`}
    <div class="t"><b>${esc(p.nombre)}</b><br>${p.precio==null?`<span class="s">⚠ sin precio</span>`:eur(p.precio)}${p.oculto?" · agotado":""}${!p.foto?` <span class="s">· sin foto</span>`:""}</div><span>›</span></button>`).join(""):"").join(""));
}
function editar(i,j){
  const p=S.carta.categorias[i].platos[j];W={tipo:"editar",i,j,p,cat:i,orig:JSON.stringify(p)};
  vista(cab("Corregir plato","lista")+`<label for="nombre">Nombre</label><input type="text" id="nombre" value="${esc(p.nombre)}">
  <label for="precio">Precio</label><input type="text" inputmode="decimal" id="precio" value="${p.precio==null?"":String(p.precio).replace(".",",")}" placeholder="Sin precio">
  <label>Sección</label><div class="chips">${S.carta.categorias.map((c,k)=>`<button class="chip ${k===i?"on":""}" data-a="e-cat" data-i="${k}">${esc(c.nombre)}</button>`).join("")}</div>
  <label>Foto</label><div id="zonaFoto">${selectorFoto(p.foto)}</div>
  ${extras(p)}
  <div class="error" id="err"></div>
  <button class="btn rojo" data-a="e-guardar">✓ Guardar cambios</button>
  <button class="btn claro" data-a="e-oculto">${p.oculto?"👁 Volver a mostrar en la carta":"🚫 Marcar como agotado (se oculta)"}</button>
  <button class="btn peligro" data-a="e-borrar">🗑 Eliminar este plato</button>`);
  W.cb=url=>{p.foto=url;editar(W.i,W.j)};
}

/* ---------- acciones ---------- */
const ACC={
  async entrar(){
    const clave=$("clave").value;if(!clave){$("err").textContent="Escribe tu clave";return}
    try{const d=await api("POST","/admin/login/"+RID,JSON.stringify({clave}),{"Content-Type":"application/json"});
      S.token=d.token;try{sessionStorage.setItem("mw_token",d.token)}catch(e){}
      if(await cargar())home()}
    catch(e){$("err").textContent=e.message==="Clave incorrecta"?"Esa clave no es correcta":e.message}
  },
  salir(){S.token=null;try{sessionStorage.removeItem("mw_token")}catch(e){}login()},
  home,lista,nuevo,ajustes,pend:()=>pend(0),
  diseno(el){W.variante=el.dataset.m;document.querySelectorAll('[data-a="diseno"]').forEach(b=>b.classList.toggle("sel",b.dataset.m===W.variante))},
  "aj-guardar"(){const n=$("nombre").value.trim();if(!n){$("err").textContent="Escribe el nombre del restaurante";return}
    S.carta.ajustes={nombre:n,subtitulo:$("sub").value.trim(),variante:W.variante};guardar();home()},
  "pend-precio"(){const v=precioDe($("precio").value);if(v==null){$("err").textContent="Escribe un precio, por ejemplo 12,50";return}
    W.actual.p.precio=v;guardar();paso_pend_sig()},
  "pend-saltar":saltar,
  cam(){$("f-cam").click()},gal(){$("f-gal").click()},
  libre(el){W.cb(el.dataset.f)},
  "n-atras"(){W.paso--;paso_nuevo()},
  "n-sig"(){
    const p=W.p;
    if(W.paso===1){const v=$("nombre").value.trim();if(!v){$("err").textContent="Escribe el nombre del plato";return}p.nombre=v;W.paso=W.cat==null?2:3}
    else if(W.paso===3){const t=$("precio").value.trim(),v=precioDe(t);if(t&&v==null){$("err").textContent="Escribe un precio, por ejemplo 12,50";return}p.precio=v;W.paso=4}
    paso_nuevo();
  },
  "n-cat"(el){W.cat=Number(el.dataset.i);W.paso=3;paso_nuevo()},
  "n-cat-nueva"(){
    vista(cab("Nueva sección","n-atras")+`<div class="pregunta">¿Cómo se llama la sección?</div><input type="text" id="cn" placeholder="Por ejemplo: Vinos"><div class="error" id="err"></div>
    <button class="btn rojo" data-a="n-cat-crear">Crear sección</button>`);$("cn").focus();
  },
  "n-cat-crear"(){const v=$("cn").value.trim();if(!v){$("err").textContent="Escribe un nombre";return}
    S.carta.categorias.push({id:slug(v)||"cat"+S.carta.categorias.length,nombre:v,sub:{es:"",en:"",de:""},platos:[]});
    W.cat=S.carta.categorias.length-1;W.paso=3;paso_nuevo()},
  "n-sinprecio"(){W.p.precio=null;W.paso=4;paso_nuevo()},
  "n-sinfoto"(){W.paso=5;paso_nuevo()},
  "n-fin"(){leerDesc(W.p);const p=W.p;p.nuevo=true;delete p.nuevo;S.carta.categorias[W.cat].platos.push(p);guardar();
    vista(`<div class="grande">🍽️</div><h1 style="text-align:center;margin-top:10px">¡Añadido!</h1><p style="text-align:center"><b>${esc(p.nombre)}</b> ya está en tu carta.</p>
    <button class="btn rojo" data-a="nuevo">➕ Añadir otro plato</button><button class="btn claro" data-a="home">Volver al inicio</button>`)},
  tog(el){const k=el.dataset.k;W.p[k]=!W.p[k];el.classList.toggle("on",!!W.p[k])},
  alerg(el){const p=W.p;p.alergenos=p.alergenos||[];const k=el.dataset.k,x=p.alergenos.indexOf(k);if(x<0)p.alergenos.push(k);else p.alergenos.splice(x,1);el.classList.toggle("on",x<0)},
  editar(el){editar(Number(el.dataset.i),Number(el.dataset.j))},
  "e-cat"(el){W.cat=Number(el.dataset.i);document.querySelectorAll('[data-a="e-cat"]').forEach(b=>b.classList.toggle("on",Number(b.dataset.i)===W.cat))},
  "e-guardar"(){
    const n=$("nombre").value.trim(),t=$("precio").value.trim(),v=precioDe(t);
    if(!n){$("err").textContent="El nombre no puede estar vacío";return}
    if(t&&v==null){$("err").textContent="Escribe un precio, por ejemplo 12,50";return}
    const p=W.p;p.nombre=n;p.precio=v;leerDesc(p);
    if(W.cat!==W.i){S.carta.categorias[W.i].platos.splice(W.j,1);S.carta.categorias[W.cat].platos.push(p)}
    guardar();lista();
  },
  "e-oculto"(){W.p.oculto=!W.p.oculto;if(!W.p.oculto)delete W.p.oculto;guardar();lista()},
  "e-borrar"(){
    vista(cab("Eliminar plato","lista")+`<div class="pregunta">¿Seguro que quieres eliminar <b>${esc(W.p.nombre)}</b>?</div><p>Dejará de verse en la carta. No se puede deshacer.</p>
    <button class="btn peligro" data-a="e-borrar-ok">Sí, eliminar</button><button class="btn claro" data-a="lista">No, volver</button>`)},
  "e-borrar-ok"(){S.carta.categorias[W.i].platos.splice(W.j,1);guardar();lista()}
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a;if(ACC[a]){e.preventDefault();ACC[a](el)}
});
async function recibir(file){
  if(!file)return;
  try{const url=await subirFoto(file);if(W&&W.cb)W.cb(url)}
  catch(e){if(e.message!=="sesion")toast("No se pudo subir la foto: "+e.message,4000,true)}
}
$("f-cam").addEventListener("change",e=>{recibir(e.target.files[0]);e.target.value=""});
$("f-gal").addEventListener("change",e=>{recibir(e.target.files[0]);e.target.value=""});
(async()=>{if(S.token&&await cargar())home();else login()})();
</script>
</body>
</html>
